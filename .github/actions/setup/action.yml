name: Setup
description: pnpm, Node, and a frozen-lockfile install — the setup every job reuses.

# NOTE: checkout is deliberately NOT here. A local composite action is read from
# the workspace, so the runner cannot find this file until actions/checkout has
# already run. Each workflow checks out first, then calls this.

runs:
  using: composite
  steps:
    # Must run before setup-node: the Node cache resolves the pnpm store path, and
    # it cannot find a store that does not exist yet.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
